<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%">
  <!-- Bottom Left: Blueprint Geometric Compass Rosette -->
  <g stroke="rgba(255, 255, 255, 0.45)" stroke-width="0.9" fill="none" transform="translate(30, 42)">
    <circle cx="0" cy="0" r="3" fill="rgba(255, 255, 255, 0.6)" />
    <circle cx="0" cy="0" r="12" stroke-dasharray="2,2" />
    <circle cx="0" cy="0" r="24" stroke="rgba(255, 255, 255, 0.3)" />
    <!-- Flower Petals -->
    <polygon points="0,-28 8,-10 0,0 -8,-10" />
    <polygon points="28,0 10,8 0,0 10,-8" />
    <polygon points="0,28 -8,10 0,0 8,10" />
    <polygon points="-28,0 -10,-8 0,0 -10,8" />
    <line x1="-32" y1="0" x2="32" y2="0" stroke="rgba(255, 255, 255, 0.25)" />
    <line x1="0" y1="-32" x2="0" y2="32" stroke="rgba(255, 255, 255, 0.25)" />
  </g>

  <!-- Bottom Right: Delicate Curved Orbit -->
  <g stroke="rgba(255, 255, 255, 0.55)" stroke-width="1.1" fill="none" transform="translate(325, 42)">
    <path d="M -18,-16 A 25 25 0 0 1 12,8" stroke-linecap="round" />
    <circle cx="12" cy="8" r="2.2" fill="#FFFFFF" />
    <circle cx="-18" cy="-16" r="1.3" fill="#FFFFFF" />
